# Retain this path so the existing private pipeline can run the full validation matrix.
# Manual only: no GitHub checkout/status reporting, releases, or isolation overrides.
trigger: none
pr: none

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: eng
      type: git
      name: engineering
      ref: refs/tags/release

variables:
  - template: ci/variables/cfs.yml@eng
  - name: CORE_TOOLS_VERSION
    value: '4.16.0'
  - name: CORE_TOOLS_BUILD_ID
    value: '308342'
  - name: AZURITE_VERSION
    value: '3.36.0'
  - name: NPM_CONFIG_USERCONFIG
    value: $(Build.SourcesDirectory)/eng/cfs/.npmrc
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: 1

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows

    sdl:
      codeql:
        compiled:
          enabled: true
        runSourceLanguagesInSourceAnalysis: true

    stages:
      - stage: WindowsValidation
        displayName: Windows validation
        dependsOn: []
        pool:
          name: 1es-pool-azfunc
          image: 1es-windows-2022
          os: windows
        jobs:
          - template: /eng/ci/templates/public/windows-validation.yml@self

      - stage: LinuxValidation
        displayName: Linux validation
        dependsOn: []
        pool:
          name: 1es-pool-azfunc
          image: 1es-ubuntu-24.04-min
          os: linux
        jobs:
          - template: /eng/ci/templates/public/dependency-validation.yml@self
            parameters:
              usePrivateCoreTools: true
          - template: /eng/ci/templates/public/smoke-tests.yml@self
            parameters:
              usePrivateCoreTools: true
              linuxPool:
                name: 1es-pool-azfunc
                image: 1es-ubuntu-22.04
                os: linux
          - template: /eng/ci/templates/public/scale-tests.yml@self

      - stage: WindowsLanguageE2E
        displayName: Windows language E2E
        dependsOn: []
        pool:
          name: 1es-pool-azfunc
          image: 1es-windows-2022
          os: windows
        jobs:
          - template: /eng/ci/templates/public/language-e2e.yml@self
            parameters:
              platform: windows
              usePrivateCoreTools: true

      - stage: LinuxLanguageE2E
        displayName: Linux language E2E
        dependsOn: []
        pool:
          name: 1es-pool-azfunc
          image: 1es-ubuntu-22.04
          os: linux
        jobs:
          - template: /eng/ci/templates/public/language-e2e.yml@self
            parameters:
              platform: linux
              usePrivateCoreTools: true
