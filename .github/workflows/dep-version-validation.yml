# Validates that dependency version changes do not break the Durable Functions\n# extension NuGet packages. Packs the Worker and WebJobs extensions from source,\n# builds Function Apps using the local packages, runs HelloCities orchestrations,\n# and verifies the output and loaded assembly versions.\nname: Dependency Version Validation

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/Worker.Extensions.DurableTask/Worker.Extensions.DurableTask.csproj'
      - 'src/WebJobs.Extensions.DurableTask/WebJobs.Extensions.DurableTask.csproj'
      - 'Directory.Packages.props'
      - 'test/SmokeTests/DepValidation/**'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/Worker.Extensions.DurableTask/Worker.Extensions.DurableTask.csproj'
      - 'src/WebJobs.Extensions.DurableTask/WebJobs.Extensions.DurableTask.csproj'
      - 'Directory.Packages.props'
      - 'test/SmokeTests/DepValidation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ====================================================================================
  # Job 1: .NET Isolated Smoke Test (Worker extension)
  # ====================================================================================
  isolated-smoke-test:
    name: '.NET Isolated Smoke Test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '20.x' }
      - run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Parse and bump Worker extension version
        id: version
        run: |
          set -e
          CSPROJ="src/Worker.Extensions.DurableTask/Worker.Extensions.DurableTask.csproj"
          PREFIX=$(grep -oP '<VersionPrefix>\K[^<]+' "$CSPROJ")
          SUFFIX=$(grep -oP '<VersionSuffix>\K[^<]+' "$CSPROJ" || true)
          IFS='.' read -r MAJ MIN PAT <<< "$PREFIX"
          PAT=$((PAT + 1))
          VER="${MAJ}.${MIN}.${PAT}"; [ -n "$SUFFIX" ] && VER="${VER}-${SUFFIX}"
          sed -i "s|<VersionPrefix>${PREFIX}</VersionPrefix>|<VersionPrefix>${MAJ}.${MIN}.${PAT}</VersionPrefix>|" "$CSPROJ"
          grep -q "<VersionPrefix>${MAJ}.${MIN}.${PAT}</VersionPrefix>" "$CSPROJ" || { echo "FAIL: sed did not update VersionPrefix"; exit 1; }
          echo "ext_version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Pack Worker extension
        run: |
          set -e
          PKG=test/SmokeTests/DepValidation/Isolated/local-packages; mkdir -p "$PKG"
          cd src/Worker.Extensions.DurableTask
          dotnet build -c Release; cp bin/Release/*.nupkg "../../$PKG/"

      - name: Generate NuGet.config
        run: |
          cat > test/SmokeTests/DepValidation/Isolated/NuGet.config << 'NUGET'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources><clear />
              <add key="local-packages" value="./local-packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local-packages">
                <package pattern="Microsoft.Azure.Functions.Worker.Extensions.DurableTask" />
              </packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          NUGET

      - name: Build smoke test app
        run: dotnet build test/SmokeTests/DepValidation/Isolated/DepValidationApp.csproj -c Release -p:SmokeTestExtVersion=${{ steps.version.outputs.ext_version }}

      - name: Verify package version in assets
        run: |
          set -e
          KEY="Microsoft.Azure.Functions.Worker.Extensions.DurableTask/${{ steps.version.outputs.ext_version }}"
          grep -qi "$KEY" test/SmokeTests/DepValidation/Isolated/obj/project.assets.json && echo "OK: $KEY" || { echo "FAIL: $KEY not found"; exit 1; }

      - name: Start Azurite
        run: |
          npm install -g azurite
          nohup azurite --silent --skipApiVersionCheck --blobPort 10000 --queuePort 10001 --tablePort 10002 > /tmp/azurite.log 2>&1 &
          for i in $(seq 1 30); do
            timeout 1 bash -c "echo>/dev/tcp/127.0.0.1/10000" 2>/dev/null && \
            timeout 1 bash -c "echo>/dev/tcp/127.0.0.1/10001" 2>/dev/null && \
            timeout 1 bash -c "echo>/dev/tcp/127.0.0.1/10002" 2>/dev/null && break
            [ $i -eq 30 ] && { cat /tmp/azurite.log; exit 1; }
            sleep 1
          done

      - name: Run isolated smoke test
        env:
          EXT_VERSION: ${{ steps.version.outputs.ext_version }}
        run: |
          set -e
          PORT=7071; TIMEOUT=120
          export AzureWebJobsStorage="UseDevelopmentStorage=true" FUNCTIONS_WORKER_RUNTIME="dotnet-isolated"
          cd test/SmokeTests/DepValidation/Isolated/bin/Release/net8.0
          func host start --port $PORT > /tmp/func.log 2>&1 & PID=$!
          for i in $(seq 1 45); do
            curl -s -o /dev/null -w "%{http_code}" "http://localhost:$PORT/admin/host/ping" | grep -q 200 && break
            kill -0 $PID 2>/dev/null || { cat /tmp/func.log; exit 1; }
            [ $i -eq 45 ] && { cat /tmp/func.log; exit 1; }; sleep 2
          done
          CODE=$(curl -s -o /tmp/start.json -w "%{http_code}" -X POST "http://localhost:$PORT/api/HelloCitiesOrchestration_HttpStart")
          [ "$CODE" = "200" ] || [ "$CODE" = "202" ] || { cat /tmp/func.log; exit 1; }
          URL=$(python3 -c "import json; d=json.load(open('/tmp/start.json')); print(d.get('statusQueryGetUri') or d.get('StatusQueryGetUri'))")
          E=0; while [ $E -lt $TIMEOUT ]; do sleep 2; E=$((E+2))
            S=$(curl -s "$URL" | python3 -c "import sys,json; print(json.load(sys.stdin).get('runtimeStatus',''))")
            if [ "$S" = "Completed" ]; then
              O=$(curl -s "$URL" | python3 -c "import sys,json; print(json.load(sys.stdin).get('output',''))")
              echo "$O" | grep -q "Hello, Tokyo!" && echo "$O" | grep -q "Hello, Seattle!" || { echo "FAIL: $O"; exit 1; }
              V=$(curl -s "http://localhost:$PORT/api/SdkVersionCheck" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Microsoft.Azure.Functions.Worker.Extensions.DurableTask',''))")
              [ "$V" = "$EXT_VERSION" ] && echo "OK: Assembly version $V" || { echo "FAIL: Expected $EXT_VERSION got $V"; exit 1; }
              echo "PASS: Isolated smoke test"; kill $PID 2>/dev/null; exit 0
            fi
            if [ "$S" = "Failed" ] || [ "$S" = "Terminated" ]; then echo "FAIL: $S"; exit 1; fi
          done; echo "FAIL: Timeout"; exit 1

      - if: failure()
        run: tail -50 /tmp/func.log 2>/dev/null || true

  # ====================================================================================
  # Job 2: .NET In-Process Smoke Test (WebJobs extension)
  # ====================================================================================
  inprocess-smoke-test:
    name: '.NET In-Process (WebJobs) Smoke Test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '20.x' }
      - run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Parse and bump WebJobs extension version
        id: version
        run: |
          set -e
          CSPROJ="src/WebJobs.Extensions.DurableTask/WebJobs.Extensions.DurableTask.csproj"
          MAJ=$(grep -oP '<MajorVersion>\K[^<]+' "$CSPROJ")
          MIN=$(grep -oP '<MinorVersion>\K[^<]+' "$CSPROJ")
          PAT=$(grep -oP '<PatchVersion>\K[^<]+' "$CSPROJ")
          PAT=$((PAT + 1))
          sed -i "s|<PatchVersion>$((PAT - 1))</PatchVersion>|<PatchVersion>${PAT}</PatchVersion>|" "$CSPROJ"
          grep -q "<PatchVersion>${PAT}</PatchVersion>" "$CSPROJ" || { echo "FAIL: sed did not update PatchVersion"; exit 1; }
          VER="${MAJ}.${MIN}.${PAT}"
          echo "ext_version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Pack WebJobs extension
        run: |
          set -e
          PKG=test/SmokeTests/DepValidation/InProcess/local-packages; mkdir -p "$PKG"
          cd src/WebJobs.Extensions.DurableTask
          dotnet build -c Release
          # Multi-TFM build produces nupkg in one of the TFM output dirs
          find bin/Release -name "*.nupkg" -exec cp {} "../../$PKG/" \;
          ls -la "../../$PKG/"

      - name: Generate NuGet.config
        run: |
          cat > test/SmokeTests/DepValidation/InProcess/NuGet.config << 'NUGET'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources><clear />
              <add key="local-packages" value="./local-packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local-packages">
                <package pattern="Microsoft.Azure.WebJobs.Extensions.DurableTask" />
              </packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          NUGET

      - name: Build in-process smoke test app
        run: dotnet build test/SmokeTests/DepValidation/InProcess/InProcessSmokeTest.csproj -c Release -p:SmokeTestWebJobsVersion=${{ steps.version.outputs.ext_version }}

      - name: Verify package version in assets
        run: |
          set -e
          KEY="Microsoft.Azure.WebJobs.Extensions.DurableTask/${{ steps.version.outputs.ext_version }}"
          grep -qi "$KEY" test/SmokeTests/DepValidation/InProcess/obj/project.assets.json && echo "OK: $KEY" || { echo "FAIL: $KEY not found"; exit 1; }

      - name: Start Azurite
        run: |
          npm install -g azurite
          nohup azurite --silent --skipApiVersionCheck --blobPort 10000 --queuePort 10001 --tablePort 10002 > /tmp/azurite.log 2>&1 &
          for i in $(seq 1 30); do
            timeout 1 bash -c "echo>/dev/tcp/127.0.0.1/10000" 2>/dev/null && \
            timeout 1 bash -c "echo>/dev/tcp/127.0.0.1/10001" 2>/dev/null && \
            timeout 1 bash -c "echo>/dev/tcp/127.0.0.1/10002" 2>/dev/null && break
            [ $i -eq 30 ] && { cat /tmp/azurite.log; exit 1; }
            sleep 1
          done

      - name: Run in-process smoke test
        env:
          EXT_VERSION: ${{ steps.version.outputs.ext_version }}
        run: |
          set -e
          PORT=7072; TIMEOUT=120
          export AzureWebJobsStorage="UseDevelopmentStorage=true" FUNCTIONS_WORKER_RUNTIME="dotnet" FUNCTIONS_INPROC_NET8_ENABLED="1"
          cd test/SmokeTests/DepValidation/InProcess/bin/Release/net8.0
          func host start --port $PORT > /tmp/func.log 2>&1 & PID=$!
          for i in $(seq 1 45); do
            curl -s -o /dev/null -w "%{http_code}" "http://localhost:$PORT/admin/host/ping" | grep -q 200 && break
            kill -0 $PID 2>/dev/null || { cat /tmp/func.log; exit 1; }
            [ $i -eq 45 ] && { cat /tmp/func.log; exit 1; }; sleep 2
          done
          CODE=$(curl -s -o /tmp/start.json -w "%{http_code}" -X POST "http://localhost:$PORT/api/HelloCitiesOrchestration_HttpStart")
          [ "$CODE" = "200" ] || [ "$CODE" = "202" ] || { cat /tmp/func.log; exit 1; }
          URL=$(python3 -c "import json; d=json.load(open('/tmp/start.json')); print(d.get('statusQueryGetUri') or d.get('StatusQueryGetUri'))")
          E=0; while [ $E -lt $TIMEOUT ]; do sleep 2; E=$((E+2))
            S=$(curl -s "$URL" | python3 -c "import sys,json; print(json.load(sys.stdin).get('runtimeStatus',''))")
            if [ "$S" = "Completed" ]; then
              O=$(curl -s "$URL" | python3 -c "import sys,json; print(json.load(sys.stdin).get('output',''))")
              echo "$O" | grep -q "Hello, Tokyo!" && echo "$O" | grep -q "Hello, Seattle!" || { echo "FAIL: $O"; exit 1; }
              V=$(curl -s "http://localhost:$PORT/api/SdkVersionCheck" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Microsoft.Azure.WebJobs.Extensions.DurableTask',''))")
              [ "$V" = "$EXT_VERSION" ] && echo "OK: Assembly version $V" || { echo "FAIL: Expected $EXT_VERSION got $V"; exit 1; }
              echo "PASS: In-process smoke test"; kill $PID 2>/dev/null; exit 0
            fi
            if [ "$S" = "Failed" ] || [ "$S" = "Terminated" ]; then echo "FAIL: $S"; exit 1; fi
          done; echo "FAIL: Timeout"; exit 1

      - if: failure()
        run: tail -50 /tmp/func.log 2>/dev/null || true
