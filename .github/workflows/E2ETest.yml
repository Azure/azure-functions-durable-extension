name: End to End Test
permissions:
  contents: read

env:
  CORE_TOOLS_VERSION: '4.8.0'
  NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/eng/cfs/.npmrc
  PIP_INDEX_URL: https://pkgs.dev.azure.com/azfunc/public/_packaging/upstream-public/pypi/simple/

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'test/e2e/**'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'test/e2e/**'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'

jobs:
  e2e:
    runs-on: ${{ matrix.backend.runner }}
    name: ${{ matrix.backend.name }} (${{ matrix.targetFramework }}, ${{ matrix.language.name }})
    strategy:
      fail-fast: false
      matrix:
        targetFramework: [net8.0, net10.0]
        backend:
          - { name: azurestorage-linux, runner: ubuntu-latest, env: AzureStorage, buildArgs: '', filterTag: AzureStorage }
          - { name: azurestorage-windows, runner: windows-latest, env: AzureStorage, buildArgs: '', filterTag: AzureStorage }
          - { name: dts, runner: ubuntu-latest, env: azureManaged, buildArgs: '-StartDTSContainer', filterTag: DTS }
        language:
          - { name: dotnet-isolated, app: BasicDotNetIsolated, filterTag: Dotnet }
          - { name: powershell, app: BasicPowerShell, filterTag: PowerShell }
          - { name: python, app: BasicPython, filterTag: Python }
          - { name: node, app: BasicNode, filterTag: Node }
          - { name: java, app: BasicJava, filterTag: Java }
    env:
      E2E_TEST_DURABLE_BACKEND: ${{ matrix.backend.env }}
      E2E_TEST_FUNCTIONS_LANGUAGE: ${{ matrix.language.name }}
      TEST_APP_NAME: ${{ matrix.language.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js (needed for Azurite)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Set up Python
        if: matrix.language.name == 'python'
        uses: actions/setup-python@v2
        with:
          python-version: 3.13

      - name: Set up JDK 17
        if: matrix.language.name == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-azurite

      - name: Install Azurite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .azurite -Force
          Set-Location .azurite
          '{"name":"azurite-local","private":true}' | Set-Content package.json
          npm install azurite

      - name: Start Azurite
        shell: pwsh
        run: |
          if ($IsWindows) {
            $azurite = Resolve-Path '.azurite/node_modules/.bin/azurite.cmd'
          } else {
            $azurite = Resolve-Path '.azurite/node_modules/.bin/azurite'
          }
          Start-Process $azurite -ArgumentList '--silent','--skipApiVersionCheck','--inMemoryPersistence','--blobPort','10000','--queuePort','10001','--tablePort','10002'
          $timeout = 30
          for ($i = 1; $i -le $timeout; $i++) {
            try {
              $tcp = [System.Net.Sockets.TcpClient]::new('127.0.0.1', 10000)
              $tcp.Dispose()
              Write-Host "Azurite is ready"
              break
            } catch {
              if ($i -eq $timeout) { throw "Azurite did not start within $timeout seconds" }
              Write-Host "Waiting for Azurite ($i/$timeout)"
              Start-Sleep -Seconds 1
            }
          }

      - name: Resolve Core Tools cache path
        id: core-tools-path
        shell: pwsh
        run: |
          . ./test/e2e/Tests/resolve-core-tools-path.ps1
          "path=$FUNC_CLI_DIRECTORY" >> $env:GITHUB_OUTPUT

      - name: Cache Core Tools
        uses: actions/cache@v4
        with:
          path: ${{ steps.core-tools-path.outputs.path }}
          key: core-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.CORE_TOOLS_VERSION }}

      - name: Setup E2E tests
        shell: pwsh
        run: |
          .\test\e2e\Tests\build-e2e-test.ps1 -SkipStorageEmulator ${{ matrix.backend.buildArgs }} -E2EAppName ${{ matrix.language.app }} -TargetFramework ${{ matrix.targetFramework }}

      - name: Build Test Project
        working-directory: test/e2e/Tests
        run: dotnet build -f ${{ matrix.targetFramework }}

      - name: Run E2E tests (${{ matrix.language.name }})
        working-directory: test/e2e/Tests
        run: dotnet test -f ${{ matrix.targetFramework }} --filter '${{ matrix.backend.filterTag }}!=Skip&${{ matrix.language.filterTag }}!=Skip&${{ matrix.language.filterTag }}-${{ matrix.backend.filterTag }}!=Skip'

  mssql:
    runs-on: ubuntu-latest
    name: mssql (${{ matrix.targetFramework }})
    strategy:
      fail-fast: false
      matrix:
        targetFramework: [net8.0, net10.0]
    env:
      E2E_TEST_DURABLE_BACKEND: "MSSQL"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js (needed for Azurite)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.13

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Initialize Environment Variables
        run: | 
          echo "MSSQL_SA_PASSWORD=TEST12_$(echo $RANDOM)!" >> $GITHUB_ENV

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-azurite

      - name: Install Azurite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .azurite -Force
          Set-Location .azurite
          '{"name":"azurite-local","private":true}' | Set-Content package.json
          npm install azurite

      - name: Start Azurite
        shell: pwsh
        run: |
          if ($IsWindows) {
            $azurite = Resolve-Path '.azurite/node_modules/.bin/azurite.cmd'
          } else {
            $azurite = Resolve-Path '.azurite/node_modules/.bin/azurite'
          }
          Start-Process $azurite -ArgumentList '--silent','--skipApiVersionCheck','--inMemoryPersistence','--blobPort','10000','--queuePort','10001','--tablePort','10002'
          $timeout = 30
          for ($i = 1; $i -le $timeout; $i++) {
            try {
              $tcp = [System.Net.Sockets.TcpClient]::new('127.0.0.1', 10000)
              $tcp.Dispose()
              Write-Host "Azurite is ready"
              break
            } catch {
              if ($i -eq $timeout) { throw "Azurite did not start within $timeout seconds" }
              Write-Host "Waiting for Azurite ($i/$timeout)"
              Start-Sleep -Seconds 1
            }
          }

      - name: Resolve Core Tools cache path
        id: core-tools-path
        shell: pwsh
        run: |
          . ./test/e2e/Tests/resolve-core-tools-path.ps1
          "path=$FUNC_CLI_DIRECTORY" >> $env:GITHUB_OUTPUT

      - name: Cache Core Tools
        uses: actions/cache@v4
        with:
          path: ${{ steps.core-tools-path.outputs.path }}
          key: core-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.CORE_TOOLS_VERSION }}

      - name: Setup E2E tests
        shell: pwsh
        run: |
          .\test\e2e\Tests\build-e2e-test.ps1 -SkipStorageEmulator -StartMSSqlContainer -TargetFramework ${{ matrix.targetFramework }}

      - name: Build Test Project
        working-directory: test/e2e/Tests
        run: dotnet build -f ${{ matrix.targetFramework }}

      - name: Setup Environment for dotnet
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "E2E_TEST_FUNCTIONS_LANGUAGE=dotnet-isolated"
          Add-Content -Path $env:GITHUB_ENV -Value "TEST_APP_NAME=BasicDotNetIsolated"

      - name: Run E2E tests (dotnet-isolated)
        working-directory: test/e2e/Tests
        run: dotnet test -f ${{ matrix.targetFramework }} --filter 'MSSQL!=Skip&Dotnet!=Skip&Dotnet-MSSQL!=Skip'

      - name: Setup Environment for PowerShell
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "E2E_TEST_FUNCTIONS_LANGUAGE=powershell"
          Add-Content -Path $env:GITHUB_ENV -Value "TEST_APP_NAME=BasicPowerShell"

      - name: Run E2E tests (PowerShell)
        working-directory: test/e2e/Tests
        run: dotnet test -f ${{ matrix.targetFramework }} --filter 'MSSQL!=Skip&PowerShell!=Skip&PowerShell-MSSQL!=Skip'

      - name: Setup Environment for Python
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "E2E_TEST_FUNCTIONS_LANGUAGE=python"
          Add-Content -Path $env:GITHUB_ENV -Value "TEST_APP_NAME=BasicPython"

      - name: Run E2E tests (Python)
        working-directory: test/e2e/Tests
        run: dotnet test -f ${{ matrix.targetFramework }} --filter 'MSSQL!=Skip&Python!=Skip&Python-MSSQL!=Skip'

      - name: Setup Environment for Node
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "E2E_TEST_FUNCTIONS_LANGUAGE=node"
          Add-Content -Path $env:GITHUB_ENV -Value "TEST_APP_NAME=BasicNode"

      - name: Run E2E tests (Node)
        working-directory: test/e2e/Tests
        run: dotnet test -f ${{ matrix.targetFramework }} --filter 'MSSQL!=Skip&Node!=Skip&Node-MSSQL!=Skip'

      - name: Setup Environment for Java
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "E2E_TEST_FUNCTIONS_LANGUAGE=java"
          Add-Content -Path $env:GITHUB_ENV -Value "TEST_APP_NAME=BasicJava"

      - name: Run E2E tests (Java)
        working-directory: test/e2e/Tests
        run: dotnet test -f ${{ matrix.targetFramework }} --filter 'MSSQL!=Skip&Java!=Skip&Java-MSSQL!=Skip'
