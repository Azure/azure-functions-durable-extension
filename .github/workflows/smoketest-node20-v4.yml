name: Smoke Test - Node 20 on Functions V4

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'test/SmokeTests/OOProcSmokeTests/durableJS/**'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'test/SmokeTests/OOProcSmokeTests/durableJS/**'

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v2

    - name: Install Docker
      run: |
        brew install --cask docker
        sudo xattr -d com.apple.quarantine /Applications/Docker.app
        open -a Docker
        # Wait for Docker to start
        while ! docker info > /dev/null 2>&1; do
          echo "Waiting for Docker to start..."
          sleep 5
        done
        
    - name: Run V4 Node 20 Smoke Test
      run: test/SmokeTests/e2e-test.ps1 -DockerfilePath test/SmokeTests/OOProcSmokeTests/durableJS/Dockerfile -HttpStartPath api/DurableFunctionsHttpStart
      shell: pwsh
