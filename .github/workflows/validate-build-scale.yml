name: Functions Scale Tests Azure Storage 
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev
    paths-ignore: [ '**.md' ]
  pull_request:
    branches:
      - '*'
    paths-ignore: [ '**.md' ]

env:
  config: Release
  AzureWebJobsStorage: UseDevelopmentStorage=true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ./test/ScaleTests/Microsoft.Azure.WebJobs.Extensions.DurableTask.FunctionsScale.Tests.csproj

    - name: Build
      run: dotnet build ./test/ScaleTests/Microsoft.Azure.WebJobs.Extensions.DurableTask.FunctionsScale.Tests.csproj -c $config --no-restore

    - name: Install Azurite
      run: npm install -g azurite

    - name: Run Scale tests
      run : |
        azurite --silent --blobPort 10000 --queuePort 10001 --tablePort 10002 &
        AZURITE_PID=$!
        trap "kill $AZURITE_PID || true" EXIT

        # Wait for Azurite to be ready
        for i in {1..30}; do
          if nc -z 127.0.0.1 10000; then
            echo "Azurite is ready"
            break
          fi
          echo "Azurite is not ready, waiting ($i/30)"
          sleep 1
        done

        # Run tests
        dotnet test ./test/ScaleTests/Microsoft.Azure.WebJobs.Extensions.DurableTask.FunctionsScale.Tests.csproj -c $config --no-build --verbosity normal