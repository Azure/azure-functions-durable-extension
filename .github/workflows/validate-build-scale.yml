name: Functions Scale Tests
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev
    paths-ignore: [ '**.md' ]
  pull_request:
    branches:
      - '*'
    paths-ignore: [ '**.md' ]

env:
  config: Release
  AzureWebJobsStorage: UseDevelopmentStorage=true

jobs:
  azure-storage:
    name: Functions Scale Tests - Azure Storage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ./test/ScaleTests/Microsoft.Azure.WebJobs.Extensions.DurableTask.FunctionsScale.Tests.csproj

    - name: Build
      run: dotnet build ./test/ScaleTests/Microsoft.Azure.WebJobs.Extensions.DurableTask.FunctionsScale.Tests.csproj -c $config --no-restore

    - name: Set up Node.js (needed for Azurite)
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Cache npm packages
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-azurite

    - name: Install Azurite
      run: |
        mkdir -p .azurite
        cd .azurite
        echo '{"name":"azurite-local","private":true}' > package.json
        npm install azurite

    - name: Run Scale tests
      run : |
        ./.azurite/node_modules/.bin/azurite --silent --skipApiVersionCheck --blobPort 10000 --queuePort 10001 --tablePort 10002 &
        AZURITE_PID=$!
        trap "kill $AZURITE_PID || true" EXIT

        # Wait for Azurite to be ready
        for i in {1..30}; do
          if nc -z 127.0.0.1 10000; then
            echo "Azurite is ready"
            break
          fi
          echo "Azurite is not ready, waiting ($i/30)"
          sleep 1
        done

        # Run tests (exclude AzureManaged and Netherite which have their own jobs)
        dotnet test ./test/ScaleTests/Microsoft.Azure.WebJobs.Extensions.DurableTask.FunctionsScale.Tests.csproj -c $config --no-build --verbosity normal --filter "FullyQualifiedName!~AzureManaged&FullyQualifiedName!~Netherite"

  netherite:
    name: Functions Scale Tests - Netherite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Set up Node.js (needed for Azurite)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install and Start Azurite
        run: |
          npm install -g azurite
          azurite --silent --skipApiVersionCheck --blobPort 10000 --queuePort 10001 --tablePort 10002 &
          for i in {1..30}; do
            if nc -z 127.0.0.1 10000; then
              echo "Azurite is ready"
              break
            fi
            echo "Waiting for Azurite ($i/30)..."
            sleep 1
          done

      - name: Start Event Hubs Emulator
        run: |
          docker run -d \
            --name eventhubs-emulator \
            -p 5672:5672 \
            -e ACCEPT_EULA=Y \
            -e BLOB_SERVER=host.docker.internal \
            -e METADATA_SERVER=host.docker.internal \
            -v ${{ github.workspace }}/test/ScaleTests/Netherite/eventhubs-emulator-config.json:/Emulator/ConfigFiles/Config.json \
            --add-host host.docker.internal:host-gateway \
            mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest

          echo "Waiting for Event Hubs emulator to be ready..."
          for i in $(seq 1 60); do
            if nc -z localhost 5672 2>/dev/null; then
              echo "Event Hubs emulator is ready!"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Event Hubs emulator failed to start within 60 seconds"
              docker logs eventhubs-emulator
              exit 1
            fi
            sleep 2
          done

      - name: Restore and Build Scale Tests
        run: dotnet build ./test/ScaleTests/Microsoft.Azure.WebJobs.Extensions.DurableTask.FunctionsScale.Tests.csproj -c $config

      - name: Run Netherite Scale Tests
        env:
          AzureWebJobsStorage: UseDevelopmentStorage=true
          EventHubsConnection: "Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
        run: dotnet test ./test/ScaleTests/Microsoft.Azure.WebJobs.Extensions.DurableTask.FunctionsScale.Tests.csproj -c $config --no-build --verbosity normal --filter "FullyQualifiedName~Netherite"

  dts:
    name: Functions Scale Tests - DTS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          global-json-file: global.json

      - name: Set up Node.js (needed for Azurite)
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite
        run: azurite --silent --skipApiVersionCheck --blobPort 10000 --queuePort 10001 --tablePort 10002 &

      - name: Wait for Azurite to be ready
        run: |
          echo "Waiting for Azurite to be ready on port 10000..."
          for i in {1..30}; do
            if nc -z localhost 10000; then
              echo "Azurite is ready."
              break
            fi
            echo "Azurite not ready yet. Retrying in 1 second..."
            sleep 1
          done
          if ! nc -z localhost 10000; then
            echo "::error::Azurite did not become ready in time."
            exit 1
          fi

      - name: Pull DTS Emulator Docker Image
        run: docker pull mcr.microsoft.com/dts/dts-emulator:latest

      - name: Start DTS Container
        run: |
          docker run -i \
            -p 8080:8080 \
            -p 8082:8082 \
            -d mcr.microsoft.com/dts/dts-emulator:latest

      - name: Wait for DTS to be ready
        run: |
          echo "Waiting for emulator to be ready..."
          for i in $(seq 1 30); do
            if nc -z localhost 8080 2>/dev/null; then
              echo "Emulator is ready!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Emulator failed to start within 30 seconds"
              exit 1
            fi
            sleep 1
          done

      - name: Restore and Build Scale Tests
        working-directory: test/ScaleTests
        run: dotnet build --configuration Release

      - name: Run Azure Managed Scale Tests
        working-directory: test/ScaleTests
        env:
          AzureWebJobsStorage: UseDevelopmentStorage=true
          DURABLE_TASK_SCHEDULER_CONNECTION_STRING: "Endpoint=http://localhost:8080;Authentication=None"
        run: dotnet test --configuration Release --no-build --verbosity normal --filter "FullyQualifiedName~AzureManaged"