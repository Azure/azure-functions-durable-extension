name: Functions Scale Tests
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev
    paths-ignore: [ '**.md' ]
  pull_request:
    branches:
      - '*'
    paths-ignore: [ '**.md' ]

env:
  config: Release
  AzureWebJobsStorage: UseDevelopmentStorage=true

jobs:
  azure-storage:
    name: Functions Scale Tests - Azure Storage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ./test/ScaleTests/Microsoft.Azure.WebJobs.Extensions.DurableTask.FunctionsScale.Tests.csproj

    - name: Build
      run: dotnet build ./test/ScaleTests/Microsoft.Azure.WebJobs.Extensions.DurableTask.FunctionsScale.Tests.csproj -c $config --no-restore

    - name: Set up Node.js (needed for Azurite)
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Cache npm packages
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-azurite

    - name: Install Azurite
      run: |
        mkdir -p .azurite
        cd .azurite
        echo '{"name":"azurite-local","private":true}' > package.json
        npm install azurite

    - name: Run Scale tests
      run : |
        ./.azurite/node_modules/.bin/azurite --silent --skipApiVersionCheck --blobPort 10000 --queuePort 10001 --tablePort 10002 &
        AZURITE_PID=$!
        trap "kill $AZURITE_PID || true" EXIT

        # Wait for Azurite to be ready
        for i in {1..30}; do
          if nc -z 127.0.0.1 10000; then
            echo "Azurite is ready"
            break
          fi
          echo "Azurite is not ready, waiting ($i/30)"
          sleep 1
        done

        # Run tests (exclude AzureManaged and SqlServer tests)
        dotnet test ./test/ScaleTests/Microsoft.Azure.WebJobs.Extensions.DurableTask.FunctionsScale.Tests.csproj -c $config --no-build --verbosity normal --filter "FullyQualifiedName!~AzureManaged&FullyQualifiedName!~SqlServer"

  mssql:
    name: Functions Scale Tests - MSSQL
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          global-json-file: global.json

      - name: Set up Node.js (needed for Azurite)
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite
        run: azurite --silent --blobPort 10000 --queuePort 10001 --tablePort 10002 &

      - name: Wait for Azurite to be ready
        run: |
          echo "Waiting for Azurite to be ready on port 10000..."
          for i in {1..30}; do
            if nc -z localhost 10000; then
              echo "Azurite is ready"
              break
            fi
            echo "Azurite is not ready, waiting ($i/30)"
            sleep 1
          done

      - name: Initialize Environment Variables
        run: |
          MSSQL_SA_PASSWORD="TEST12_${RANDOM}!"
          echo "MSSQL_SA_PASSWORD=$MSSQL_SA_PASSWORD" >> $GITHUB_ENV
          echo "SQLDB_Connection=Server=localhost,1433;Database=DurableDB;User Id=sa;Password=$MSSQL_SA_PASSWORD;TrustServerCertificate=True;Encrypt=False;" >> $GITHUB_ENV

      - name: Pull SQL Server Docker Image
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest

      - name: Start SQL Server Container
        run: |
          docker run --name mssql-server \
            -e ACCEPT_EULA=Y \
            -e "MSSQL_SA_PASSWORD=$MSSQL_SA_PASSWORD" \
            -e "MSSQL_PID=Express" \
            -p 1433:1433 \
            -d mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL Server to be ready
        run: |
          echo "Waiting for SQL Server to be ready..."
          SQL_READY=0
          for i in {1..30}; do
            if docker exec mssql-server /opt/mssql-tools*/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready"
              SQL_READY=1
              break
            fi
            echo "SQL Server is not ready, waiting ($i/30)"
            sleep 2
          done
          if [ "$SQL_READY" -ne 1 ]; then
            echo "ERROR: SQL Server did not become ready within the expected time."
            docker logs mssql-server || true
            exit 1
          fi
          docker ps

      - name: Restore and Build Scale Tests
        working-directory: test/ScaleTests
        run: dotnet build --configuration Release

      - name: Run SQL Server Scale Tests
        working-directory: test/ScaleTests
        env:
          AzureWebJobsStorage: UseDevelopmentStorage=true
        run: dotnet test --configuration Release --no-build --verbosity normal --filter "FullyQualifiedName~SqlServer"
