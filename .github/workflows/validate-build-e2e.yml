name: Validate Build (E2E tests)

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev
    paths-ignore: [ '**.md' ]
  pull_request:
    branches:
      - '*'
    paths-ignore: [ '**.md' ]

env:
  solution: WebJobs.Extensions.DurableTask.sln
  config: Release
  AzureWebJobsStorage: UseDevelopmentStorage=true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]

    name: E2E (${{ matrix.framework }})

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v3

    - name: Set up .NET Core 3.1
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '3.1.x'

    - name: Set up .NET Core 2.1
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '2.1.x'

    - name: Set up .NET 6.0
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore $solution

    - name: Build
      run: dotnet build $solution --no-restore

    # Install Azurite
    - name: Set up Node.js (needed for Azurite)
      uses: actions/setup-node@v3
      with:
        node-version: '18.x' # Azurite requires at least Node 18

    - name: Install Azurite
      run: npm install -g azurite

    # Run tests - xUnit parallelizes across 8 test classes automatically
    - name: Run FunctionsV2 E2E tests - ${{ matrix.framework }}
      run: azurite --silent --blobPort 10000 --queuePort 10001 --tablePort 10002 & dotnet test ./test/FunctionsV2/WebJobs.Extensions.DurableTask.Tests.V2.csproj --framework ${{ matrix.framework }} --no-build --filter "TestType=E2E"
