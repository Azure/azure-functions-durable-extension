name: Validate Build (E2E tests)

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev
    paths-ignore: [ '**.md' ]
  pull_request:
    branches:
      - '*'
    paths-ignore: [ '**.md' ]

env:
  config: Release
  AzureWebJobsStorage: UseDevelopmentStorage=true
  SecondaryStorage: 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:11000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:11001/devstoreaccount1;TableEndpoint=http://127.0.0.1:11002/devstoreaccount1;'
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]

    name: E2E (${{ matrix.framework }})

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ./test/FunctionsV2/WebJobs.Extensions.DurableTask.Tests.V2.csproj

    - name: Build
      run: dotnet build ./test/FunctionsV2/WebJobs.Extensions.DurableTask.Tests.V2.csproj --no-restore

    - name: Set up Node.js (needed for Azurite)
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Cache npm packages
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-azurite

    - name: Install Azurite
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path .azurite -Force
        Set-Location .azurite
        '{"name":"azurite-local","private":true}' | Set-Content package.json
        npm install azurite

    - name: Start Azurite
      shell: pwsh
      run: |
        Start-Process (Resolve-Path '.azurite\node_modules\.bin\azurite.cmd') -ArgumentList '--silent','--skipApiVersionCheck','--location','.azurite-primary','--blobPort','10000','--queuePort','10001','--tablePort','10002'
        Start-Process (Resolve-Path '.azurite\node_modules\.bin\azurite.cmd') -ArgumentList '--silent','--skipApiVersionCheck','--location','.azurite-secondary','--blobPort','11000','--queuePort','11001','--tablePort','11002'
        $timeout = 30
        foreach ($port in 10000, 10001, 10002, 11000, 11001, 11002) {
          for ($i = 1; $i -le $timeout; $i++) {
            try {
              $tcp = [System.Net.Sockets.TcpClient]::new('127.0.0.1', $port)
              $tcp.Dispose()
              Write-Host "Azurite on port $port is ready"
              break
            } catch {
              if ($i -eq $timeout) { throw "Azurite on port $port did not start within $timeout seconds" }
              Write-Host "Waiting for Azurite on port $port ($i/$timeout)"
              Start-Sleep -Seconds 1
            }
          }
        }

    - name: Run FunctionsV2 E2E tests - ${{ matrix.framework }}
      run: dotnet test ./test/FunctionsV2/WebJobs.Extensions.DurableTask.Tests.V2.csproj --framework ${{ matrix.framework }} --no-build --filter "TestType=E2E" -- xunit.maxParallelThreads=1
