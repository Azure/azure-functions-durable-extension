name: Smoke Test - .NET in-proc w/ MSSQL on Functions V4

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'test/SmokeTests/BackendSmokeTests/MSSQL/**'
      - '.github/workflows/smoketest-mssql-inproc-v4.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'test/SmokeTests/BackendSmokeTests/MSSQL/**'
      - '.github/workflows/smoketest-mssql-inproc-v4.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Smoke Test (MSSQL) (${{ matrix.targetFramework }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetFramework: net8.0
            dotnetInprocTag: 4-dotnet8.0
          - targetFramework: net10.0
            dotnetInprocTag: 4-dotnet10.0
    env:
      SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
      FUNCTIONS_INPROC_NET8_ENABLED: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Run V4 .NET in-proc w/ MSSQL Smoke Test
      run: test/SmokeTests/e2e-test.ps1 -DockerfilePath test/SmokeTests/BackendSmokeTests/MSSQL/Dockerfile -HttpStartPath api/DurableFunctionsHttpStart -ContainerName MSSQLApp -SetupSQLServer -TargetFramework ${{ matrix.targetFramework }} -DotnetSdkTag 10.0 -DotnetInprocTag ${{ matrix.dotnetInprocTag }}
      shell: pwsh
