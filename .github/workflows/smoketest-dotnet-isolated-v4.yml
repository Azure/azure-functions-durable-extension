name: Smoke Test - .NET Isolated on Functions V4

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'test/SmokeTests/OOProcSmokeTests/DotNetIsolated/**'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'test/SmokeTests/OOProcSmokeTests/DotNetIsolated/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Smoke Test (.NET Isolated) (${{ matrix.targetFramework }})
    strategy:
      fail-fast: false
      matrix:
        targetFramework: [net8.0, net10.0]
    steps:
    - uses: actions/checkout@v4

    # Install .NET versions
    - name: Set up .NET Core 3.1
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '3.1.x'

    - name: Set up .NET Core 2.1
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '2.1.x'

    - name: Set up .NET Core 6.x
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.x'

    - name: Set up .NET Core 8.x
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.x'

    - name: Set up .NET Core 10.x
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Restore WebJobs extension
      run: dotnet restore $solution

    - name: Build and pack WebJobs extension
      run: cd ./src/WebJobs.Extensions.DurableTask &&
        dotnet build -c Release WebJobs.Extensions.DurableTask.csproj &&
        mkdir ~/packages &&
        dotnet nuget push ./bin/Release/Microsoft.Azure.WebJobs.Extensions.DurableTask.*.nupkg --source ~/packages &&
        dotnet nuget add source ~/packages

    - name: Build .NET Isolated Smoke Test
      run: cd ./test/SmokeTests/OOProcSmokeTests/DotNetIsolated &&
        dotnet restore --verbosity normal -p:TargetFramework=${{ matrix.targetFramework }} &&
        dotnet build -c Release -f ${{ matrix.targetFramework }}

    - name: Install core tools
      run: npm i -g azure-functions-core-tools@4 --unsafe-perm true
  
    # Run smoke tests
    # Unlike other smoke tests, the .NET isolated smoke tests run outside of a docker container, but to race conditions
    # when building the smoke test app in docker, causing the build to fail. This is a temporary workaround until the
    # root cause is identified and fixed.

    - name: Set up Node.js (needed for Azurite)
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Cache Azurite
      id: cache-azurite
      uses: actions/cache@v3
      with:
        path: .azurite
        key: ${{ runner.os }}-azurite-v1

    - name: Install Azurite
      if: steps.cache-azurite.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path .azurite -Force
        Set-Location .azurite
        '{"name":"azurite-local","private":true}' | Set-Content package.json
        npm install azurite

    - name: Start Azurite
      shell: pwsh
      run: |
        Start-Process (Resolve-Path '.azurite\node_modules\.bin\azurite.cmd') -ArgumentList '--silent','--blobPort','10000','--queuePort','10001','--tablePort','10002'
        $timeout = 30
        for ($i = 1; $i -le $timeout; $i++) {
          try {
            $tcp = [System.Net.Sockets.TcpClient]::new('127.0.0.1', 10000)
            $tcp.Dispose()
            Write-Host "Azurite is ready"
            break
          } catch {
            if ($i -eq $timeout) { throw "Azurite did not start within $timeout seconds" }
            Write-Host "Waiting for Azurite ($i/$timeout)"
            Start-Sleep -Seconds 1
          }
        }

    - name: Run smoke tests (Hello Cities (Typed))
      shell: pwsh
      run: |
        ./test/SmokeTests/OOProcSmokeTests/DotNetIsolated/run-smoke-tests.ps1 -HttpStartPath api/StartHelloCitiesTyped
        
    - name: Run smoke tests (Hello Cities (Untyped))
      shell: pwsh
      run: |
        ./test/SmokeTests/OOProcSmokeTests/DotNetIsolated/run-smoke-tests.ps1 -HttpStartPath api/StartHelloCitiesUntyped

    - name: Run smoke tests (Hello Cities) with provided Instance Id
      shell: pwsh
      run: |
        ./test/SmokeTests/OOProcSmokeTests/DotNetIsolated/run-smoke-tests.ps1 -HttpStartPath api/StartHelloCitiesUntyped -TestWithCustomInstanceId

    - name: Run smoke tests (Process Exit)
      shell: pwsh
      run: |
        ./test/SmokeTests/OOProcSmokeTests/DotNetIsolated/run-smoke-tests.ps1 -HttpStartPath api/durable_HttpStartProcessExitOrchestrator

    - name: Run smoke tests (Timeout)
      shell: pwsh
      run: |
        ./test/SmokeTests/OOProcSmokeTests/DotNetIsolated/run-smoke-tests.ps1 -HttpStartPath api/durable_HttpStartTimeoutOrchestrator

    - name: Run smoke tests (OOM)
      shell: pwsh
      run: |
        ./test/SmokeTests/OOProcSmokeTests/DotNetIsolated/run-smoke-tests.ps1 -HttpStartPath api/durable_HttpStartOOMOrchestrator

    - name: Run smoke tests (Entity Counting (Typed))
      shell: pwsh
      run: |
        ./test/SmokeTests/OOProcSmokeTests/DotNetIsolated/run-smoke-tests.ps1 -HttpStartPath api/StartEntityOrchestration
