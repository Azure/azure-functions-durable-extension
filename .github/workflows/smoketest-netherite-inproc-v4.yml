name: Smoke Test - .NET in-proc w/ Netherite on Functions V4

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'test/SmokeTests/BackendSmokeTests/Netherite/**'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'test/SmokeTests/BackendSmokeTests/Netherite/**'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Smoke Test (Netherite) (${{ matrix.targetFramework }})
    strategy:
      fail-fast: false
      matrix:
        targetFramework: [net8.0, net10.0]

    env:
      FUNCTIONS_INPROC_NET8_ENABLED: "1"

    steps:
    - uses: actions/checkout@v4
    - name: Run V4 .NET in-proc w/ Netherite Smoke Test
      run: test/SmokeTests/e2e-test.ps1 -DockerfilePath test/SmokeTests/BackendSmokeTests/Netherite/Dockerfile -HttpStartPath api/DurableFunctionsHttpStart -ContainerName NetheriteApp -TargetFramework ${{ matrix.targetFramework }} -DotnetSdkTag 10.0
      shell: pwsh
