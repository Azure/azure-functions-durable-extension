name: Validate Build (analyzer)

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev
    paths-ignore: [ '**.md' ]
  pull_request:
    branches:
      - '*'
    paths-ignore: [ '**.md' ]

env:
  config: Release
  AzureWebJobsStorage: UseDevelopmentStorage=true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          8.0.x
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ./test/WebJobs.Extensions.DurableTask.Analyzers.Test/WebJobs.Extensions.DurableTask.Analyzers.Test.csproj

    - name: Build
      run: dotnet build ./test/WebJobs.Extensions.DurableTask.Analyzers.Test/WebJobs.Extensions.DurableTask.Analyzers.Test.csproj --no-restore

    # Install Azurite
    - name: Set up Node.js (needed for Azurite)
      uses: actions/setup-node@v3
      with:
        node-version: '18.x' # Azurite requires at least Node 18

    - name: Install Azurite
      run: npm install -g azurite

    # Run tests
    - name: Run Analyzer tests
      run: azurite --silent --blobPort 10000 --queuePort 10001 --tablePort 10002 & dotnet test ./test/WebJobs.Extensions.DurableTask.Analyzers.Test/WebJobs.Extensions.DurableTask.Analyzers.Test.csproj --no-build

