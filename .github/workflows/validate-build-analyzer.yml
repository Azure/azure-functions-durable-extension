name: Validate Build (analyzer)

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev
    paths-ignore: [ '**.md' ]
  pull_request:
    branches:
      - '*'
    paths-ignore: [ '**.md' ]

env:
  config: Release
  AzureWebJobsStorage: UseDevelopmentStorage=true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          8.0.x
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ./test/WebJobs.Extensions.DurableTask.Analyzers.Test/WebJobs.Extensions.DurableTask.Analyzers.Test.csproj

    - name: Build
      run: dotnet build ./test/WebJobs.Extensions.DurableTask.Analyzers.Test/WebJobs.Extensions.DurableTask.Analyzers.Test.csproj --no-restore

    - name: Set up Node.js (needed for Azurite)
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Cache npm packages
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-azurite

    - name: Install Azurite
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path .azurite -Force
        Set-Location .azurite
        '{"name":"azurite-local","private":true}' | Set-Content package.json
        npm install azurite

    - name: Start Azurite
      shell: pwsh
      run: |
        Start-Process (Resolve-Path '.azurite\node_modules\.bin\azurite.cmd') -ArgumentList '--silent','--skipApiVersionCheck','--blobPort','10000','--queuePort','10001','--tablePort','10002'
        $timeout = 30
        for ($i = 1; $i -le $timeout; $i++) {
          try {
            $tcp = [System.Net.Sockets.TcpClient]::new('127.0.0.1', 10000)
            $tcp.Dispose()
            Write-Host "Azurite is ready"
            break
          } catch {
            if ($i -eq $timeout) { throw "Azurite did not start within $timeout seconds" }
            Write-Host "Waiting for Azurite ($i/$timeout)"
            Start-Sleep -Seconds 1
          }
        }

    - name: Run Analyzer tests
      run: dotnet test ./test/WebJobs.Extensions.DurableTask.Analyzers.Test/WebJobs.Extensions.DurableTask.Analyzers.Test.csproj --no-build
